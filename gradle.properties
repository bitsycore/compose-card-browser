# =====================
# Gradle
# =====================

org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.tooling.parallel=true

# =====================
# Kotlin
# =====================

kotlin.code.style=official
kotlin.native.ignoreDisabledTargets=true

# =====================
# Android
# =====================

android.useAndroidX=true
android.nonTransitiveRClass=true

# =====================
# Compose
# =====================

org.jetbrains.compose.experimental.uikit.enabled=true

# Only read when nativeDesktop is on, since nothing else declares those targets.
org.jetbrains.compose.experimental.macos.enabled=true

# =====================
# Experimental
# =====================

# Compose Desktop on Kotlin/Native, instead of on the JVM. Off: it declares four extra targets,
# fetches and compiles SQLite, and is not part of any ordinary build. See docs/NATIVE_DESKTOP.md.
nativeDesktop=false
